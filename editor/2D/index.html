<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>2D Level Editor</title><link rel="stylesheet" href="style.css">
<header><strong>2D Level Editor</strong><input id="manifest" aria-label="Manifest URL" placeholder="Project manifest URL"><button id="load">Load project</button><select id="levels" aria-label="Level"></select><button id="save">Save project</button><button id="export">Export project</button><label class="button">Import bundle<input id="import" type="file" accept="application/json" hidden></label><a id="preview" target="_blank">Runtime preview</a></header>
<nav><select id="tool" aria-label="Tool"><option value="select">Select / move</option><option value="paint">Paint / place</option><option value="erase">Erase</option><option value="rectangle">Rectangle fill</option><option value="resize">Resize object</option><option value="camera">Position camera</option><option value="reference">Pick reference target</option></select><button id="undo">Undo</button><button id="redo">Redo</button><button id="delete">Delete selected</button><button id="fit">Fit level</button><label><input id="grid" type="checkbox" checked>Grid</label><label><input id="snap" type="checkbox" checked>Snap</label><span>Wheel: zoom · middle/right drag: pan</span><output id="dirty"></output></nav>
<main><aside><h2>Layers</h2><div id="layers"></div><button id="addTile">+ Tile layer</button><button id="addObject">+ Object layer</button><h2>Palette</h2><div id="palette"></div></aside><section id="surface"><canvas id="canvas" tabindex="0" aria-label="Level editing canvas"></canvas></section><aside><h2>Properties</h2><div id="properties"></div><h2>Level settings</h2><div id="levelSettings"></div><h2>Global settings</h2><div id="globalSettings"></div></aside></main>
<footer id="status" role="status">Load a manifest to begin.</footer><section id="errors" aria-label="Validation messages" role="alert"></section>
<script type="module" src="src/app.js"></script>
</html>
